[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:eva-web]
command=gunicorn -k gevent -w 1 -b 0.0.0.0:%(ENV_PORT)s --timeout 120 app:app
directory=/app
autostart=true
autorestart=true
startretries=5
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:eva-agent]
command=python agent.py start
directory=/app
autostart=true
autorestart=true
startretries=5
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0