<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call Eva</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f1115;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #eaeaea;
  }
  .card {
    text-align: center;
    padding: 40px;
    border-radius: 16px;
    background: #171a21;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    max-width: 380px;
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p.sub { color: #9aa0aa; font-size: 14px; margin: 0 0 28px; }
  button {
    font-size: 16px;
    padding: 14px 28px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, #6c5ce7, #a29bfe);
    color: white;
    cursor: pointer;
    font-weight: 600;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  button:hover { transform: translateY(-1px); }
  button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  #status { margin-top: 20px; font-size: 14px; min-height: 20px; color: #9aa0aa; }
  #status.ok { color: #55e07a; }
  #status.err { color: #ff6b6b; }
</style>
</head>
<body>
  <div class="card">
    <h1>📞 Talk to Eva</h1>
    <p class="sub">Tap below and your phone will ring in a few seconds.</p>
    <button id="callBtn">Call me</button>
    <div id="status"></div>
  </div>

<script>
const btn = document.getElementById('callBtn');
const status = document.getElementById('status');

btn.addEventListener('click', async () => {
  btn.disabled = true;
  status.className = '';
  status.textContent = 'Calling...';
  try {
    const res = await fetch('/call', { method: 'POST' });
    const data = await res.json();
    if (data.ok) {
      status.className = 'ok';
      status.textContent = 'Call started (SID: ' + data.call_sid + '). Your phone should ring shortly.';
    } else {
      status.className = 'err';
      status.textContent = 'Error: ' + data.error;
    }
  } catch (e) {
    status.className = 'err';
    status.textContent = 'Request failed: ' + e;
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
